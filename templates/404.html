{% extends "base.html" %}

{% block title %}
Page Not Found | Employee Project Management System
{% endblock %}

{% block content %}

<style>
    .error-page {
        min-height: 500px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .error-content {
        max-width: 650px;
    }

    .error-number {
        font-family: 'Cormorant Garamond', serif;
        font-size: 150px;
        font-weight: 600;
        color: #292929;
        line-height: 0.9;
        margin: 0;
    }

    .error-line {
        width: 60px;
        height: 2px;
        background-color: #555;
        margin: 25px auto;
    }

    .error-content h1 {
        font-family: 'Cormorant Garamond', serif;
        font-size: 38px;
        font-weight: 600;
        margin: 0 0 15px;
        color: #292929;
    }

    .error-content p {
        color: #6b6965;
        font-size: 15px;
        margin-bottom: 30px;
    }

    .home-button {
        display: inline-block;
        background-color: #303030;
        color: white;
        text-decoration: none;
        padding: 12px 25px;
        border: 1px solid #303030;
        font-size: 14px;
        transition: 0.3s;
    }

    .home-button:hover {
        background-color: transparent;
        color: #303030;
    }

    @media (max-width: 700px) {

        .error-number {
            font-size: 110px;
        }

        .error-content h1 {
            font-size: 32px;
        }
    }
</style>


<section class="error-page">

    <div class="error-content">

        <p class="error-number">
            404
        </p>

        <div class="error-line"></div>

        <h1>
            Page Not Found
        </h1>

        <p>
            The page you are looking for does not exist
            or may have been moved.
        </p>

        <a
            href="{% url 'home' %}"
            class="home-button"
        >
            Return to Dashboard
        </a>

    </div>

</section>

{% endblock %}
